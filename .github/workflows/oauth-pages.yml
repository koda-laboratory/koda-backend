# Publishes web/ (the OAuth consent page of the MCP server) to GitHub Pages:
# https://koda-laboratory.github.io/koda-backend/oauth/consent
name: OAuth consent page

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/oauth-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
